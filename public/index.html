<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ALBIDA Kitchen · Service Reports</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script></head>
<body>
<main>
<div class="workspace"><form id="report-form"><section><div class="section-heading"><span>01</span><h2>Service details</h2></div><div class="grid"><label>Service date <b>*</b><input name="date" type="date" required></label><label>Chef on duty <b>*</b><input name="chef" maxlength="120" placeholder="Chef’s full name" required></label><label>Service time <b>*</b><select name="service"><option>Breakfast &amp; lunch</option><option>Dinner</option></select></label><label><span id="covers-label">Guest covers</span> <b>*</b><input name="covers" type="number" min="0" max="10000" step="1" placeholder="0" required></label></div><label>Service overview <b>*</b><textarea name="overview" placeholder="How did the service go?" required></textarea></label></section>
<section><div class="section-heading"><span>02</span><h2>From the menu</h2></div><label>Menu served <b>*</b><select name="menu"><option>Zambezi Menu</option><option>African Heritage</option><option>Breakfast &amp; lunch</option><option>Local Experience</option></select></label><div class="dish-heading"><span>Dishes served <b>*</b></span><span>QUANTITY / DISH</span></div><div id="dishes"></div><button class="text-button" id="add-dish" type="button">+ Add another dish</button><label>Dietary requirements<textarea name="dietary" placeholder="e.g. 1 × Gluten free"></textarea></label></section>
<section><div class="section-heading"><span>03</span><h2>The guest experience</h2></div><label>Turndown service<textarea name="turndown" placeholder="Rooms serviced and turndown details"></textarea></label><label>Guest feedback<textarea name="feedback" placeholder="What did your guests share?"></textarea></label><label>Conclusion<textarea name="conclusion" placeholder="Your closing thoughts on the service"></textarea></label><label>Additional notes<textarea name="notes" placeholder="Follow-ups, reminders, or details for the next shift"></textarea></label></section>
<p class="muted">Open your report in WhatsApp for +263 78 561 7589, then press Send. Reports are not saved by this site.</p><div class="form-footer"><span>* Required fields</span><button id="new-report" type="button" class="text-button">Start a fresh report</button><button class="primary" type="submit" id="save">Open WhatsApp <span>↗</span></button></div><p id="status" role="status" aria-live="polite"></p></form>
</div>
<footer>ALBIDA KITCHEN<span>Care in every detail.</span></footer></main>
</body></html>
